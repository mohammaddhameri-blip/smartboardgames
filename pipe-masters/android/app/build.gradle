plugins {
    id 'com.android.application'
}

android {
    namespace 'my.smartboard.pipemasters'
    compileSdk 35
    defaultConfig {
        applicationId 'my.smartboard.pipemasters'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

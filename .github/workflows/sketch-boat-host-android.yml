name: Sketch Boat Host APK
on:
  workflow_dispatch:
  push:
    paths:
      - "sketch-boat/android-host/**"
      - ".github/workflows/sketch-boat-host-android.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build host Android APK
        working-directory: sketch-boat/android-host
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare download
        run: cp sketch-boat/android-host/app/build/outputs/apk/debug/app-debug.apk sketch-boat-host.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sketch-boat-host-apk
          path: sketch-boat-host.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sketch-boat-host-apk-latest
          name: Sketch Boat Host Android APK
          body: |
            Android camera host for Sketch Boat.
            Pair with smartboard using the 8-character code. Requires internet.
            Debug-signed test build, not a production-signed Android release.
          files: sketch-boat-host.apk
          overwrite_files: true
          make_latest: false

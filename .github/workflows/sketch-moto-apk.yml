name: Build Sketch Moto Android APK
on:
  push:
    branches: [main]
    paths:
      - "sketch-moto/**"
      - ".github/workflows/sketch-moto-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Bundle offline fallback
        run: |
          mkdir -p sketch-moto/android/app/src/main/assets
          cp sketch-moto/index.html sketch-moto/android/app/src/main/assets/offline.html
          cp sketch-moto/icon.svg sketch-moto/android/app/src/main/assets/icon.svg
          cp sketch-moto/manifest.webmanifest sketch-moto/android/app/src/main/assets/manifest.webmanifest

      - name: Assemble Android APK
        working-directory: sketch-moto/android
        run: gradle --no-daemon assembleDebug

      - name: Name the installer
        run: cp sketch-moto/android/app/build/outputs/apk/debug/app-debug.apk SketchMoto-latest.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SketchMoto-Android-APK
          path: SketchMoto-latest.apk
          retention-days: 90

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sketch-moto-latest
          name: "Sketch Moto — Latest Android APK"
          prerelease: true
          make_latest: false
          files: SketchMoto-latest.apk
          overwrite_files: true
          body: |
            Installable debug-signed Sketch Moto APK for classroom testing.
            The Android app loads the same GitHub Pages game as the browser; an offline fallback is bundled.
            Not yet production-signed for Play Store distribution.
